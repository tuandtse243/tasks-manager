# Generated by scrum-github. Fails when a pull request does not close a task ("Closes #n").
name: scrum-pr-link-check

on:
  pull_request_target:
    types: [opened, edited, reopened, labeled, unlabeled, ready_for_review, synchronize]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  linked-task:
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch only, to get .github/scrum. Code from the pull request is never checked out or run.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Check the pull request closes a task
        run: .github/scrum/bin/scrum pr-check
        env:
          GH_TOKEN: ${{ github.token }}
