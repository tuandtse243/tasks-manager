# Generated by scrum-github. Checks every pull request: a Conventional Commits title, a source
# branch the base branch accepts, and a linked task ("Closes #n"). Release, promotion and
# back-merge pull requests are exempt. The job name "pr-check" is the required check that
# /scrum-github:protect puts on the long-lived branches.
name: scrum-pr-link-check

on:
  pull_request_target:
    types: [opened, edited, reopened, labeled, unlabeled, ready_for_review, synchronize]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch only, to get .github/scrum. Code from the pull request is never checked out or run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - name: Pull request title
        run: .github/scrum/bin/scrum pr-check --title
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Source branch
        if: ${{ !cancelled() }}
        run: .github/scrum/bin/scrum pr-check --source
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Linked task
        if: ${{ !cancelled() }}
        run: .github/scrum/bin/scrum pr-check --link
        env:
          GH_TOKEN: ${{ github.token }}
