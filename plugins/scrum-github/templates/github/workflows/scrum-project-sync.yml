# Generated by scrum-github. Syncs task statuses between the "status: ..." labels and the project board.
# GitHub Actions cannot react to cards moved on a board, so board changes arrive on this schedule.
# Needs the repository secret SCRUM_PROJECT_TOKEN (Projects and Issues read/write).
name: scrum-project-sync

on:
  schedule:
    - cron: "{{PROJECT_POLL_CRON}}"
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, milestoned, demilestoned]

permissions:
  issues: write
  contents: read

concurrency:
  group: scrum-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Scheduled and issue runs use the file of the default branch; the configuration and the
      # runtime come from the working branch of the preset (empty: the default branch).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: "{{CHECKOUT_REF}}"
          sparse-checkout: .github
      - name: Sync the project board
        run: |
          if [ -n "$ISSUE" ]; then
            .github/scrum/bin/scrum project sync --issue "$ISSUE"
          else
            .github/scrum/bin/scrum project sync
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SCRUM_PROJECT_TOKEN: ${{ secrets.SCRUM_PROJECT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
