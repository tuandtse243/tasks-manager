# Generated by scrum-github. Publishes a version when its release or hotfix pull request is merged into {{RELEASE_BRANCH}}: tag on the merge commit, GitHub Release, tasks Done, back-merge pull requests.
name: scrum-release

on:
  pull_request_target:
    types: [closed]
    branches: ['{{RELEASE_BRANCH}}']

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: scrum-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finish:
    # github.head_ref is the name of the pull request's head branch (only its name is read, never its code).
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch only, to get .github/scrum. Code from the pull request is never checked out or run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - name: Tag, GitHub Release, tasks Done, back-merge
        run: .github/scrum/bin/scrum release finish
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: moves the cards on the project board at once (project.enabled in .github/scrum.yml).
          SCRUM_PROJECT_TOKEN: ${{ secrets.SCRUM_PROJECT_TOKEN }}
