# Generated by scrum-github. Edit it freely: init never overwrites it.
# Keeps the GitHub Actions of the workflows up to date: one grouped pull request a week, into the
# working branch, titled as a Conventional Commit ("ci: ...") and marked as a change without a task.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: {{WORKING_BRANCH}}
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels:
      - "{{NO_TASK_LABEL}}"
