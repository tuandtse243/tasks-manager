# Generated by scrum-github. Deploys each long-lived branch to its environment with Cloudflare Wrangler.
#
# Branch -> environment (from the branching preset): {{DEPLOY_MAP}}
# Each environment is a Wrangler environment of the same name ([env.staging], [env.production]
# in wrangler.toml, or "env" in wrangler.jsonc); `wrangler deploy --env <environment>` deploys it.
# Secrets of each GitHub environment (Settings -> Environments): CLOUDFLARE_API_TOKEN (a token with
# the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# Add required reviewers to the environment `production`: deployments to it wait for approval.
# Rollback: Actions -> deploy -> Run workflow, with an environment and a released version (tag).
#
# Checked on 2026-11-24 against: developers.cloudflare.com/workers/wrangler/commands/workers/
# (deploy --env, updated 2026-10-26), .../wrangler/environments/ (2026-10-18),
# .../wrangler/system-environment-variables/ (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# 2026-11-12) and .../ci-cd/external-cicd/github-actions/ (2026-10-18). Wrangler 4.163.0 from npm.
# Wrangler runs with npx instead of cloudflare/wrangler-action, so no third-party action is used.
name: deploy

on:
  push:
    branches: {{DEPLOY_BRANCHES}}
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        options:
{{DEPLOY_ENV_OPTIONS}}
      version:
        description: Released version (tag) to deploy again, e.g. {{TAG_PREFIX}}1.3.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Choose the environment
        id: target
        env:
          BRANCH_ENVIRONMENTS: '{{DEPLOY_MAP}}'
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_VERSION" in
              ''|*[!A-Za-z0-9._/-]*) echo "::error::Version must be a released tag such as {{TAG_PREFIX}}1.3.0 (got: $INPUT_VERSION)"; exit 1 ;;
            esac
            environment="$INPUT_ENVIRONMENT"; ref="refs/tags/$INPUT_VERSION"
          else
            environment="$(printf '%s' "$BRANCH_ENVIRONMENTS" | jq -r --arg b "$REF_NAME" '.[$b] // ""')"
            ref="$SHA"
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Check the deployment secrets
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets of the environment $ENVIRONMENT:$missing. Add them in Settings -> Environments -> $ENVIRONMENT."
            exit 1
          fi
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Deploy with Wrangler
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.163.0 deploy --env "$ENVIRONMENT"
