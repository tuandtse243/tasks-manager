# Generated by scrum-github. Deploys each long-lived branch to its environment with Docker: one image per source tree in ghcr.io, deployed over SSH with Docker Compose.
#
# Branch -> environment (from the branching preset): {{DEPLOY_MAP}}
# Secrets of each GitHub environment (Settings -> Environments): DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan <host>`). Optional
# variable DEPLOY_PATH: the folder of docker-compose.yml on the server (default: the login folder).
# The compose file uses the image as `image: ${IMAGE}`; the server must be able to pull it from
# ghcr.io (a public package, or `docker login ghcr.io` with a token that can read packages).
# Add required reviewers to the environment `production`: deployments to it wait for approval.
# Rollback: Actions -> deploy -> Run workflow, with an environment and a released version (tag).
#
# The image tag is the git tree hash, so a promotion or release merge that does not change the
# source deploys the image already built and tested on the lower environment. A pushed version
# tag (and a rollback) also tags that image with the version. Tags created by a workflow with the
# GITHUB_TOKEN do not start workflows; a rollback adds the version tag then.
# Written on 2026-11-24 with the docker, docker buildx and ssh command-line tools of the
# ubuntu-latest runner and actions/checkout only: no third-party action.
name: deploy

on:
  push:
    branches: {{DEPLOY_BRANCHES}}
    tags: ['{{TAG_PREFIX}}*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        options:
{{DEPLOY_ENV_OPTIONS}}
      version:
        description: Released version (tag) to deploy again, e.g. {{TAG_PREFIX}}1.3.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Choose the environment
        id: target
        env:
          BRANCH_ENVIRONMENTS: '{{DEPLOY_MAP}}'
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_VERSION" in
              ''|*[!A-Za-z0-9._/-]*) echo "::error::Version must be a released tag such as {{TAG_PREFIX}}1.3.0 (got: $INPUT_VERSION)"; exit 1 ;;
            esac
            environment="$INPUT_ENVIRONMENT"; ref="refs/tags/$INPUT_VERSION"; version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = tag ]; then
            environment=""; ref="$SHA"; version="$REF_NAME"
          else
            environment="$(printf '%s' "$BRANCH_ENVIRONMENTS" | jq -r --arg b "$REF_NAME" '.[$b] // ""')"
            ref="$SHA"; version=""
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the image once per source tree
        id: image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tree="$(git rev-parse 'HEAD^{tree}')"
          if docker manifest inspect "$image:$tree" >/dev/null 2>&1; then
            echo "The image of source tree $tree exists: no build."
          else
            docker build -t "$image:$tree" .
            docker push "$image:$tree"
          fi
          if [ -n "$VERSION" ]; then
            docker buildx imagetools create -t "$image:$(printf '%s' "$VERSION" | tr '/' '-')" "$image:$tree"
          fi
          echo "image=$image:$tree" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [plan, image]
    if: needs.plan.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - name: Check the deployment secrets
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets of the environment $ENVIRONMENT:$missing. Add them in Settings -> Environments -> $ENVIRONMENT."
            exit 1
          fi
      - name: Deploy over SSH with Docker Compose
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${DEPLOY_PATH:-.}' && IMAGE='$IMAGE' docker compose pull && IMAGE='$IMAGE' docker compose up -d"
          rm -f ~/.ssh/deploy_key
