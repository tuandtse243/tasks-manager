<!doctype html>
<html lang="__SCRUM_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SCRUM_TITLE__</title>
<style>
/* The plan view written next to plan.json by `scrum plan check`, `render` and `apply`.
   Self-contained like report.html: system fonts only, nothing loaded from the network.
   The text and the timeline are written into the page; the script below only draws the
   dependency graph. */
:root {
  --bg: #f5f7f9; --surface: #ffffff; --sunk: #eceff3; --line: #d8dee4; --fg: #1b2530; --muted: #5a6672;
  --accent: #0b6b86; --accent-soft: #dcedf2;
  --add: #1d7f45; --add-soft: #dcf0e3; --chg: #b86e00; --chg-soft: #f6e8d2; --del: #b4371f; --del-soft: #f7e0da;
  --f1: #0b6b86; --f2: #6b4fd8; --f3: #1d7f45; --f4: #b4371f; --now: #9aa6b2;
  --ai: #1d5fbf; --ai-soft: #dfe9f8; --human: #b86e00; --human-soft: #f6e8d2;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161c; --surface: #18212a; --sunk: #1f2a35; --line: #2c3a46; --fg: #e3eaf0; --muted: #98a6b3;
    --accent: #5cc2de; --accent-soft: #16313b;
    --add: #5cc98a; --add-soft: #173524; --chg: #f0a94a; --chg-soft: #3a2c14; --del: #f0866c; --del-soft: #3a1f18;
    --f1: #5cc2de; --f2: #a793ff; --f3: #5cc98a; --f4: #f0866c; --now: #6b7884;
    --ai: #7fb0ff; --ai-soft: #1a2a44; --human: #f0a94a; --human-soft: #3a2c14;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); }
main { max-width: 960px; margin: 0 auto; padding: 28px 16px 72px; display: flex; flex-direction: column; gap: 36px; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 1.9rem; letter-spacing: -0.015em; overflow-wrap: anywhere; }
h2 { font-size: 1.1rem; display: flex; align-items: baseline; gap: 10px; }
h2 .n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-weight: 500; }
h3 { font-size: 0.98rem; overflow-wrap: anywhere; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
section { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

/* summary */
.head { display: flex; flex-direction: column; gap: 10px; }
.crumbs { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; background: var(--chg-soft); color: var(--chg); }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--chg); }
.state.done { background: var(--add-soft); color: var(--add); }
.state.done i { background: var(--add); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-size: 1.45rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { font-size: 0.8rem; color: var(--muted); }
.kpi.warn b { color: var(--chg); }
.kpi.ai b { color: var(--ai); } .kpi.hu b { color: var(--human); }
.warnings { background: var(--chg-soft); border: 1px solid var(--chg); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; }
.warnings ul { margin: 4px 0 0; padding-left: 1.2em; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.78rem; color: var(--muted); }
.legend .sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.f1 { background: var(--f1); } .sw.f2 { background: var(--f2); } .sw.f3 { background: var(--f3); } .sw.f4 { background: var(--f4); }

/* changes */
.diff { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 5px 10px; font-size: 0.86rem; max-width: 100%; }
.chip b { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
.chip span { color: var(--fg); overflow-wrap: anywhere; }
.chip.add { background: var(--add-soft); color: var(--add); }
.chip.chg { background: var(--chg-soft); color: var(--chg); }
.chip.del { background: var(--del-soft); color: var(--del); text-decoration: line-through; }
.chip.del span { color: var(--muted); }

/* graph */
.scroll { overflow-x: auto; }
.scroll svg { display: block; height: auto; }
svg text { font-family: var(--font); fill: var(--fg); }
svg .tm { fill: var(--muted); }
svg .mono { font-family: var(--mono); }
svg .wavebg { fill: var(--sunk); }
svg .node rect.bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .node.f1 rect.stripe { fill: var(--f1); } svg .node.f2 rect.stripe { fill: var(--f2); }
svg .node.f3 rect.stripe { fill: var(--f3); } svg .node.f4 rect.stripe { fill: var(--f4); }
svg .node.backlog rect.bg { stroke-dasharray: 5 4; fill: var(--sunk); }
svg .node { cursor: pointer; transition: opacity 0.2s; }
svg .node:focus { outline: none; }
svg .node:focus rect.bg, svg .node.hot rect.bg { stroke: var(--accent); stroke-width: 2.2; }
svg .av { fill: var(--sunk); }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.8; transition: opacity 0.2s; }
svg .edge.hot { stroke: var(--accent); stroke-width: 2.6; }
svg .flow { stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -13; } }
svg .dim { opacity: 0.22; }
/* timeline: drawn to scale by plan-html.jq */
.scroll svg.tl { width: 100%; min-width: 760px; }
.sw.tl-ai { background: var(--ai); } .sw.tl-hw { background: var(--human); opacity: 0.55; }
.sw.tl-merge { background: var(--muted); opacity: 0.4; } .sw.tl-h { background: var(--human); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .b-ai { fill: var(--ai); } svg .b-hw { fill: var(--human); opacity: 0.55; }
svg .b-merge { fill: var(--muted); opacity: 0.4; } svg .b-h { fill: var(--human); }
svg .tai { fill: var(--ai); } svg .th { fill: var(--human); } svg text.onbar { fill: #fff; }
svg .done { stroke: var(--ai); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .now { stroke: var(--del); stroke-width: 2; }
.waves { margin: 0; padding-left: 1.2em; font-size: 0.84rem; color: var(--muted); }
.waves b { color: var(--fg); font-weight: 600; }

/* load */
.load { display: flex; flex-direction: column; gap: 12px; }
.load hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.cap-track { height: 30px; background: var(--sunk); border-radius: 8px; display: flex; position: relative; overflow: hidden; }
.seg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.74rem; font-family: var(--mono); color: #fff; border-right: 2px solid var(--surface); overflow: hidden; white-space: nowrap; }
.seg.now { background: var(--now); }
.seg.f1 { background: var(--f1); } .seg.f2 { background: var(--f2); } .seg.f3 { background: var(--f3); } .seg.f4 { background: var(--f4); }
.capline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--del); }
.cap-legend { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; gap: 6px; }
.over { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--chg); flex-wrap: wrap; }
.over .ghost { border: 1.5px dashed var(--chg); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 0.76rem; }
.lrow { display: grid; grid-template-columns: 160px 1fr 190px; gap: 12px; align-items: center; }
.lrow .who { font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; }
.lrow .who small { font-weight: 400; color: var(--chg); }
.lrow .val { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.lrow.over-row .val b { color: var(--del); }
.track { height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.track i.now { background: var(--now); } .track i.add { background: var(--accent); }
@media (max-width: 560px) { .lrow { grid-template-columns: 1fr; gap: 4px; } .lrow .val { text-align: left; } }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border-left: 4px solid var(--f1); scroll-margin-top: 16px; }
.card.f2 { border-left-color: var(--f2); } .card.f3 { border-left-color: var(--f3); } .card.f4 { border-left-color: var(--f4); }
.card.backlog { border-style: dashed; border-left-style: solid; }
.card:target { box-shadow: 0 0 0 2px var(--accent); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .id { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.card .issue { font-family: var(--mono); font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.card .body { white-space: pre-line; overflow-wrap: anywhere; }
.badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.badge.add { background: var(--add-soft); color: var(--add); } .badge.chg { background: var(--chg-soft); color: var(--chg); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: 0.76rem; background: var(--sunk); border-radius: 4px; padding: 2px 7px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fact.dim { color: var(--muted); }
.fact.ai { color: var(--ai); } .fact.hu { color: var(--human); }
.fact.bl { border: 1px dashed var(--chg); background: transparent; color: var(--chg); }
.check { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; }
.check li { overflow-wrap: anywhere; }
.check li::before { content: "\2610\00a0\00a0"; color: var(--muted); }

/* review, actions, assumptions */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; overflow-wrap: anywhere; }
.tick { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.tick.done { background: var(--add-soft); color: var(--add); } .tick.keep { background: var(--sunk); color: var(--muted); }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.act b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.act span { font-size: 0.82rem; color: var(--muted); }
details pre { font-family: var(--mono); font-size: 0.78rem; background: var(--sunk); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.two .panel { display: flex; flex-direction: column; gap: 8px; }
.two ul { margin: 0; padding-left: 1.1em; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.confirm { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.confirm .say { font-family: var(--mono); font-size: 0.86rem; }

@media (prefers-reduced-motion: reduce) {
  svg .flow { animation: none; }
  svg .mover { display: none; }
  svg .node, svg .edge { transition: none; }
}
</style>
</head>
<body>
<main>
__SCRUM_BODY__
</main>
<script id="scrum-data" type="application/json">__SCRUM_DATA__</script>
<script>
(function () {
  // Draws the dependency graph by wave. Every text goes in through textContent.
  var d, svg = document.getElementById("dag");
  try { d = JSON.parse(document.getElementById("scrum-data").textContent); } catch (err) { return; }
  if (!svg || !d.tasks || !d.tasks.length) return;
  var S = d.strings || {}, NS = "http://www.w3.org/2000/svg";
  function t(key, args) {
    var s = S[key] != null ? S[key] : key; args = args || {};
    return s.replace(/\{(\w+)\}/g, function (m, a) { return args[a] != null ? String(args[a]) : m; });
  }
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function anchor(id) { return "task-" + String(id).replace(/[^A-Za-z0-9_-]/g, "_"); }
  function cut(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function initials(login) { return String(login).replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase(); }

  var byId = {}; d.tasks.forEach(function (k) { byId[k.id] = k; });
  var waves = (d.waves && d.waves.length) ? d.waves : [d.tasks.map(function (k) { return k.id; })];
  var COL = 250, GAP = 40, PAD = 30, NW = 220, NH = 56, ROW = 90, TOP = 40;
  var rows = Math.max.apply(null, waves.map(function (w) { return w.length; }));
  var W = PAD * 2 + waves.length * COL + (waves.length - 1) * GAP - 20, H = TOP + rows * ROW + 4;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("width", W); svg.setAttribute("height", H);

  var pos = {};
  waves.forEach(function (w, i) {
    var x = PAD + i * (COL + GAP);
    svg.appendChild(el("rect", { x: x - 10, y: 8, width: COL, height: H - 12, rx: 10, "class": "wavebg" }));
    svg.appendChild(el("text", { x: x + 4, y: 28, "font-size": 11, "font-weight": 700, "class": "tm", "letter-spacing": 1 },
      t(w.length > 1 ? "plan_wave_parallel" : "plan_wave", { n: i + 1 }).toUpperCase()));
    w.forEach(function (id, j) { pos[id] = { x: x, y: TOP + j * ROW }; });
  });

  var edges = [], nodes = [];
  d.tasks.forEach(function (k) {
    (k.depends_on || []).forEach(function (dep) {
      var a = pos[dep], b = pos[k.id]; if (!a || !b) return;
      var x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
      var p = el("path", { "class": "edge flow", d: "M" + x1 + " " + y1 + " C" + mx + " " + y1 + " " + mx + " " + y2 + " " + x2 + " " + y2 });
      p.setAttribute("data-from", dep); p.setAttribute("data-to", k.id);
      svg.appendChild(p); edges.push(p);
    });
  });
  d.tasks.forEach(function (k) {
    var p = pos[k.id]; if (!p) return;
    var link = el("a", { href: "#" + anchor(k.id) });
    var g = el("g", { "class": "node f" + ((k.feature_index % 4) + 1) + (k.sprint && k.sprint.kind === "backlog" ? " backlog" : ""), tabindex: 0 });
    g.setAttribute("data-id", k.id);
    g.appendChild(el("title", null, k.id + " " + k.title));
    g.appendChild(el("rect", { "class": "bg", x: p.x, y: p.y, width: NW, height: NH, rx: 8 }));
    g.appendChild(el("rect", { "class": "stripe", x: p.x, y: p.y, width: 5, height: NH, rx: 2 }));
    var meta = k.id + " · " + (k.points == null ? t("plan_not_estimated") : t("plan_kpi_points", { n: k.points }))
      + (k.issue != null ? " · #" + k.issue : "") + (k.sprint && k.sprint.kind === "backlog" ? " · " + t("plan_backlog") : "");
    g.appendChild(el("text", { x: p.x + 14, y: p.y + 21, "font-size": 11, "class": "mono tm" }, meta));
    g.appendChild(el("text", { x: p.x + 14, y: p.y + 42, "font-size": 12.5, "font-weight": 600 }, cut(k.title, (k.assignees || []).length ? 26 : 30)));
    if ((k.assignees || []).length) {
      g.appendChild(el("circle", { cx: p.x + NW - 20, cy: p.y + 19, r: 12, "class": "av" }));
      g.appendChild(el("text", { x: p.x + NW - 20, y: p.y + 23, "font-size": 9.5, "font-weight": 700, "text-anchor": "middle" }, initials(k.assignees[0])));
    }
    link.appendChild(g); svg.appendChild(link); nodes.push(g);
  });

  function walk(id, up, seen) {
    edges.forEach(function (e) {
      var a = e.getAttribute("data-from"), b = e.getAttribute("data-to");
      var next = up ? (b === id ? a : null) : (a === id ? b : null);
      if (next && !seen[next]) { seen[next] = 1; walk(next, up, seen); }
    });
    return seen;
  }
  function light(id) {
    var on = {}; on[id] = 1;
    [walk(id, true, {}), walk(id, false, {})].forEach(function (s) { Object.keys(s).forEach(function (k) { on[k] = 1; }); });
    nodes.forEach(function (n) { var k = n.getAttribute("data-id"); n.classList.toggle("dim", !on[k]); n.classList.toggle("hot", k === id); });
    edges.forEach(function (e) { var hit = on[e.getAttribute("data-from")] && on[e.getAttribute("data-to")]; e.classList.toggle("dim", !hit); e.classList.toggle("hot", !!hit); });
  }
  function clear() { nodes.concat(edges).forEach(function (x) { x.classList.remove("dim"); x.classList.remove("hot"); }); }
  nodes.forEach(function (n) {
    var id = n.getAttribute("data-id");
    n.addEventListener("mouseenter", function () { light(id); });
    n.addEventListener("focus", function () { light(id); });
    n.addEventListener("mouseleave", clear);
    n.addEventListener("blur", clear);
  });
})();
</script>
</body>
