name: Task
description: A task for the current sprint
labels: ["status: New"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: false
  - type: dropdown
    id: points
    attributes:
      label: Points
      description: Story points. Leave empty if not estimated yet.
      options:
        - "0"
        - "1"
        - "3"
        - "7"
    validations:
      required: false

