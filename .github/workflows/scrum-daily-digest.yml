# Generated by scrum-github. Posts the sprint digest as a comment on the "<sprint> digest" issue.
name: scrum-daily-digest

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs use the file of the default branch; the configuration and the runtime come
      # from the working branch of the preset (empty: the default branch).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: "develop"
          sparse-checkout: .github
      - name: Post digest
        run: .github/scrum/bin/scrum digest
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: the digest also goes to a chat (Slack, Google Chat, Mattermost or Telegram)
          # when this repository secret is set; see digest.webhook_format in .github/scrum.yml.
          SCRUM_DIGEST_WEBHOOK: ${{ secrets.SCRUM_DIGEST_WEBHOOK }}

