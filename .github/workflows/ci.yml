name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# The workflow runs the code of the pull request, so it gets read access only and no secret.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to develop and main (merges) are
# never cancelled, so every merged commit gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu always. macOS (Bash 3.2 and BSD tools, as the plugin's users have) only on pull
        # requests into main, i.e. release and hotfix pull requests: hosted macOS runners are
        # sometimes not available at all ("not acquired"), which cancels the job and fails the
        # run. There a rerun before the merge fixes it, and develop and main stay green.
        os: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install yq
        if: runner.os == 'macOS'
        run: brew install yq
      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          yq --version
      - name: Offline tests
        run: bash plugins/scrum-github/tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        working-directory: plugins/scrum-github
        run: |
          shellcheck --version
          shellcheck --severity=warning bin/scrum runtime/bin/scrum runtime/lib/*.sh scripts/*.sh wizards/*.sh tests/run.sh tests/test_*.sh tests/fake-gh
