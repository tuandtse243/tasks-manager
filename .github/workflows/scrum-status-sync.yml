# Generated by scrum-github. Moves tasks between statuses when pull requests and issues change.
name: scrum-status-sync

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed]
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: scrum-status-sync-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch only, to get .github/scrum. Code from the pull request is never checked out or run.
      # Issue events run the file of the default branch; they read the working branch of the preset.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'issues' && 'develop' || '' }}
          sparse-checkout: .github
      - name: Update task status
        run: .github/scrum/bin/scrum event
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: moves the card on the project board at once (project.enabled in .github/scrum.yml).
          SCRUM_PROJECT_TOKEN: ${{ secrets.SCRUM_PROJECT_TOKEN }}

